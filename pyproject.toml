[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "titanic_module"
version = "0.0.1"
description = "Proyecto con base de datos de personas a bordo del Titanic, usando Cookiecutter, POO y MLFlow"
authors = [
  { name = "Angel Anaya" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.13.0"


[tool.ruff]
line-length = 99
src = ["titanic_module"]
include = ["pyproject.toml", "titanic_module/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["titanic_module"]
force-sort-within-sections = true

